<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة انتظار المنزل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one TV-sized screen, night-sky ground. Start side = clock + prayers (sand accent), end side = Arsenal fixtures (club red, used only as a marker). Deliberately single dark theme to keep a TV screen dim. */
:root {
  --night: #0c1220;        /* ground */
  --night-2: rgba(16, 22, 38, .72);  /* raised surface, see-through over the scene */
  --line: #24304a;         /* hairlines */
  --ink: #e9e4d8;          /* primary text, warm off-white */
  --ink-dim: #8f97a8;      /* secondary text, blue-grey */
  --sand: #d8b26a;         /* prayer accent */
  --sand-soft: rgba(216, 178, 106, .14);
  --gunner: #d4283c;       /* club red, markers only */
  --gunner-soft: rgba(212, 40, 60, .16);
  --f-display: "Alexandria", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Alexandria", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: clamp(14px, 1.15vw, 26px);
  overflow: hidden;
}
@media (max-width: 899px) { body { overflow: auto; } }

.stage {
  box-sizing: border-box;
  min-height: 100%;
  padding-block: clamp(16px, 3.2vh, 56px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  grid-template-rows: auto 1fr auto;
  gap: clamp(16px, 2.6vw, 56px);
  transition: transform 6s ease-in-out;
  position: relative;
  z-index: 1;
  text-shadow: 0 1px 12px rgba(5, 8, 16, .55);
}

/* ---------- background scene: an original Najdi majlis at night ---------- */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--night); }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* Only the lantern layer animates, and only its opacity, so a modest TV GPU can keep up. */
.scene .glow { animation: flicker 5s ease-in-out infinite; will-change: opacity; }
@keyframes flicker { 0%, 100% { opacity: .88; } 40% { opacity: 1; } 55% { opacity: .8; } 70% { opacity: .95; } }
@media (prefers-reduced-motion: reduce) { .scene .glow { animation: none; } }
@media (min-width: 900px) {
  .stage { padding-left: max(3.5vw, env(safe-area-inset-left, 0px)); padding-right: max(3.5vw, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } }

/* ---------- clock ---------- */
.clock { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: .35em; min-width: 0; }
.time {
  font-family: var(--f-body);
  font-weight: 300;
  font-size: clamp(64px, 9.5vw, 220px);
  line-height: .95;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  text-align: right;
}
.time .side { display: inline-flex; flex-direction: column; justify-content: space-between; gap: .1em; font-size: .3em; margin-left: .25em; vertical-align: top; padding-top: .35em; line-height: 1; }
.time .sec { color: var(--ink-dim); }
.time .ampm { color: var(--sand); font-family: var(--f-display); }
.dates { display: flex; flex-wrap: wrap; gap: .4em 1.2em; font-size: 1.35em; color: var(--ink-dim); }
.dates .hijri { color: var(--sand); }

/* ---------- next prayer ---------- */
.next {
  grid-column: 1; grid-row: 2; align-self: center;
  display: flex; flex-direction: column; gap: .3em; min-width: 0;
}
.eyebrow { font-size: .95em; letter-spacing: .04em; color: var(--ink-dim); }
.next-name { font-family: var(--f-display); font-weight: 600; font-size: clamp(36px, 4.6vw, 104px); color: var(--sand); line-height: 1.1; }
.next-count { font-size: clamp(26px, 2.8vw, 64px); font-weight: 400; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.next-at { color: var(--ink-dim); font-size: 1.2em; }

/* ---------- prayer row ---------- */
.prayers {
  grid-column: 1 / -1; grid-row: 3;
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  padding-top: clamp(12px, 2.2vh, 32px);
  gap: clamp(8px, 1vw, 20px);
}
.p { display: flex; flex-direction: column; gap: .2em; padding: .5em .7em; border-radius: 10px; position: relative; }
.p-name { font-family: var(--f-display); font-weight: 500; font-size: 1.45em; }
.p-time { font-size: 2.1em; font-weight: 400; font-variant-numeric: tabular-nums; }
.p.sunrise .p-name, .p.sunrise .p-time { color: var(--ink-dim); }
.p.past { opacity: .45; }
.p.is-next { background: var(--sand-soft); }
.p.is-next .p-name, .p.is-next .p-time { color: var(--sand); }
.p.is-next::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 18%; bottom: 18%;
  width: 3px; border-radius: 2px; background: var(--sand);
}

/* ---------- Arsenal ---------- */
.club { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 24px); min-width: 0; }
.club-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1em; }
.club-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 2.3vw, 52px); margin: 0; display: flex; align-items: center; gap: .45em; }
.club-title::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: var(--gunner); flex: none; }
.club-note { color: var(--ink-dim); font-size: .9em; }

.feature {
  background: var(--night-2);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(14px, 1.6vw, 32px);
  display: flex; flex-direction: column; gap: .5em;
}
.f-comp { display: flex; align-items: center; justify-content: space-between; gap: 1em; color: var(--ink-dim); font-size: 1em; }
.badge { font-size: .85em; padding: .15em .7em; border-radius: 999px; background: var(--gunner-soft); color: #f1a4ad; white-space: nowrap; }
.badge.live { background: var(--gunner); color: #fff; }
.f-teams { font-family: var(--f-display); font-weight: 600; font-size: clamp(24px, 2.4vw, 56px); line-height: 1.2; text-wrap: balance; }
.f-teams .vs { color: var(--ink-dim); font-weight: 500; font-size: .6em; margin-inline: .3em; }
.f-when { font-size: 1.25em; }
.f-count { font-size: 1.15em; color: var(--sand); font-variant-numeric: tabular-nums; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 6.6em minmax(0, 1fr) auto; align-items: center;
  gap: 1em; padding: .65em 0; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.r-date { color: var(--ink-dim); font-size: .95em; line-height: 1.3; }
.r-date b { display: block; color: var(--ink); font-weight: 500; font-size: 1.1em; }
.r-match { font-size: 1.2em; min-width: 0; }
.r-match .ha { font-size: .75em; color: var(--ink-dim); margin-inline-start: .4em; }
.r-time { font-size: 1.2em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-comp { display: block; font-size: .72em; color: var(--ink-dim); }
.empty { color: var(--ink-dim); font-size: 1.1em; padding: 1em 0; }

.foot { margin-top: auto; color: var(--ink-dim); font-size: .85em; display: flex; flex-direction: column; gap: .25em; }

/* ---------- narrow screens (phone preview) ---------- */
@media (max-width: 899px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .clock, .next, .prayers, .club { grid-column: 1; grid-row: auto; }
  .prayers { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  body { font-size: 15px; }
}
</style>

    { key: "fajr",    name: "الفجر" },
    { key: "sunrise", name: "الشروق" },
    { key: "dhuhr",   name: "الظهر" },
    { key: "asr",     name: "العصر" },
    { key: "maghrib", name: "المغرب" },
    { key: "isha",    name: "العشاء" }
  ];

  function fmt(opts) {
    try { return new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", Object.assign({ timeZone: TZ }, opts)); }
    catch (e) { return new Intl.DateTimeFormat("ar", Object.assign({ timeZone: TZ }, opts)); }
  }
  var fTime12 = fmt({ hour: "numeric", minute: "2-digit", hour12: true });
  var fDay = fmt({ weekday: "long" });
  var fGreg = fmt({ day: "numeric", month: "long", year: "numeric" });
  var fDayMonth = fmt({ day: "numeric", month: "long" });
  var fLongDay = fmt({ weekday: "long", day: "numeric", month: "long" });
  var fParts = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  var fHijri = null, fHijriMonth = null;
  try {
    fHijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn", { timeZone: TZ, day: "numeric", month: "long", year: "numeric" });
    fHijriMonth = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { timeZone: TZ, month: "numeric" });
  } catch (e) {}

  function riyadhParts(d) {
    var out = {};
    fParts.formatToParts(d).forEach(function (p) { out[p.type] = p.value; });
    return { y: +out.year, m: +out.month, d: +out.day, h: +out.hour % 24, mi: +out.minute, s: +out.second };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hm12(d) { return fTime12.format(d); }

  function isRamadan(d) {
    if (!fHijriMonth) return false;
    try { return parseInt(fHijriMonth.format(d), 10) === 9; } catch (e) { return false; }
  }

  // Prayer times for a given Riyadh calendar day (offset in days from today).
  var cache = {};
  function timesFor(now, offsetDays) {
    var p = riyadhParts(new Date(now.getTime() + offsetDays * 864e5));
    var key = p.y + "-" + p.m + "-" + p.d;
    if (cache[key]) return cache[key];
    if (!window.adhan) return null;
    var params = adhan.CalculationMethod.UmmAlQura();
    var t = new adhan.PrayerTimes(new adhan.Coordinates(COORDS.lat, COORDS.lng), new Date(p.y, p.m - 1, p.d), params);
    var res = { fajr: t.fajr, sunrise: t.sunrise, dhuhr: t.dhuhr, asr: t.asr, maghrib: t.maghrib, isha: t.isha };
    if (isRamadan(t.dhuhr)) res.isha = new Date(t.maghrib.getTime() + 120 * 60000);
    cache[key] = res;
    return res;
  }

  function duration(ms, withSeconds) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return withSeconds ? h + ":" + pad(m) + ":" + pad(sec) : h + ":" + pad(m);
  }
  function humanUntil(ms) {
    var mins = Math.round(ms / 60000);
    var d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    function unit(n, one, two, few, many) { return n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10 ? n + " " + few : n + " " + many); }
    if (d > 0) return "بعد " + unit(d, "يوم", "يومين", "أيام", "يومًا") + (h ? " و" + unit(h, "ساعة", "ساعتين", "ساعات", "ساعة") : "");
    if (h > 0) return "بعد " + unit(h, "ساعة", "ساعتين", "ساعات", "ساعة") + (m ? " و" + unit(m, "دقيقة", "دقيقتين", "دقائق", "دقيقة") : "");
    return "بعد " + unit(Math.max(1, m), "دقيقة", "دقيقتين", "دقائق", "دقيقة");
  }

  var $ = function (id) { return document.getElementById(id); };

  function renderClock(now) {
    var p = riyadhParts(now);
    $("time").innerHTML = (p.h % 12 || 12) + ":" + pad(p.mi) +
      '<span class="side"><span class="sec">' + pad(p.s) + '</span><span class="ampm">' + (p.h < 12 ? "ص" : "م") + "</span></span>";
    $("dayName").textContent = fDay.format(now);
    $("greg").textContent = fGreg.format(now);
    if (fHijri) { try { $("hijri").textContent = fHijri.format(now); } catch (e) {} }
  }

  function renderPrayers(now) {
    var today = timesFor(now, 0);
    if (!today) { $("nextName").textContent = "جارٍ التحميل"; return; }
    var nextKey = null, nextTime = null;
    for (var i = 0; i < PRAYERS.length; i++) {
      var k = PRAYERS[i].key;
      if (k === "sunrise") continue;
      if (today[k] > now) { nextKey = k; nextTime = today[k]; break; }
    }
    if (!nextKey) { var tm = timesFor(now, 1); nextKey = "fajr"; nextTime = tm.fajr; }

    var nextIsToday = today[nextKey] === nextTime;
    var html = "";
    PRAYERS.forEach(function (pr) {
      var t = today[pr.key];
      var cls = "p" + (pr.key === "sunrise" ? " sunrise" : "");
      if (t <= now) cls += " past";
      if (nextIsToday && pr.key === nextKey) cls += " is-next";
      html += '<div class="' + cls + '"><span class="p-name">' + pr.name + '</span><span class="p-time">' + hm12(t) + "</span></div>";
    });
    $("prayers").innerHTML = html;

    var name = PRAYERS.filter(function (x) { return x.key === nextKey; })[0].name;
    $("nextName").textContent = name;
    $("nextCount").textContent = duration(nextTime - now, true);
    $("nextAt").textContent = (nextIsToday ? "اليوم " : "غدًا ") + "الساعة " + hm12(nextTime);
  }

  function renderMatches(now) {
    var upcoming = FIXTURES
      .map(function (f) { return Object.assign({ t: new Date(f.at) }, f); })
      .filter(function (f) { return f.t.getTime() + MATCH_LENGTH_MS > now.getTime(); });

    if (!upcoming.length) {
      $("feature").innerHTML = '<p class="empty">انتهت المباريات المسجّلة في الجدول. يحتاج الجدول تحديثًا.</p>';
      $("list").innerHTML = "";
      return;
    }

    var f = upcoming[0];
    var live = now >= f.t;
    var teams = f.home
      ? 'أرسنال<span class="vs">ضد</span>' + f.opp
      : f.opp + '<span class="vs">ضد</span>أرسنال';
    $("feature").innerHTML =
      '<div class="f-comp"><span>' + f.comp + "</span>" +
      '<span class="badge' + (live ? " live" : "") + '">' + (live ? "جارية الآن" : (f.home ? "على أرضه" : "خارج أرضه")) + "</span></div>" +
      '<div class="f-teams">' + teams + "</div>" +
      '<div class="f-when">' + fLongDay.format(f.t) + " · " + hm12(f.t) + "</div>" +
      (live ? "" : '<div class="f-count">' + humanUntil(f.t - now) + "</div>");

    $("list").innerHTML = upcoming.slice(1, 5).map(function (m) {
      return '<li class="row">' +
        '<span class="r-date"><b>' + fDay.format(m.t) + "</b>" + fDayMonth.format(m.t) + "</span>" +
        '<span class="r-match">' + m.opp + '<span class="ha">' + (m.home ? "على أرضه" : "خارج أرضه") + '</span><span class="r-comp">' + m.comp + "</span></span>" +
        '<span class="r-time">' + hm12(m.t) + "</span></li>";
    }).join("");
  }

  var lastMinute = -1;
  function tick() {
    var now = new Date();
    renderClock(now);
    renderPrayers(now);
    var p = riyadhParts(now);
    if (p.mi !== lastMinute) { lastMinute = p.mi; renderMatches(now); }
  }

  // Small drift every few minutes so static elements don't sit on the same pixels for hours.
  function drift() {
    var x = Math.round((Math.random() - .5) * 24), y = Math.round((Math.random() - .5) * 16);
    $("stage").style.transform = "translate(" + x + "px," + y + "px)";
  }

  // Reload once a day around 3 a.m. Riyadh time to pick up an updated fixture list.
  function scheduleReload() {
    setInterval(function () {
      var p = riyadhParts(new Date());
      if (p.h === 3 && p.mi === 0) { try { location.reload(); } catch (e) {} }
    }, 60000);
  }

  tick();
  setInterval(tick, 1000);
  if (!window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(drift, 180000);
  scheduleReload();
  if (!window.adhan) {
    var tries = 0;
    var wait = setInterval(function () { tries++; if (window.adhan || tries > 20) { clearInterval(wait); tick(); } }, 500);
  }
})();
</script>
</body>
</html>
